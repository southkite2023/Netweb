<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Quota Hub</title>
  <desc id="desc">Concept artwork for a planned balance and usage dashboard, showing API, traffic and cloud categories without live account data.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a32"/><stop offset="1" stop-color="#080d17"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#79efd0"/><stop offset="1" stop-color="#72cfff"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g fill="none" stroke="#90dcca" opacity=".08"><circle cx="930" cy="190" r="280"/><circle cx="930" cy="190" r="360"/><path d="M0 670h1200M0 710h1200"/></g>
  <g font-family="system-ui, sans-serif">
    <text x="90" y="113" fill="#89e5ce" font-size="20" letter-spacing="5">PROJECT / 001</text>
    <text x="86" y="205" fill="#eefbf8" font-size="76" font-weight="650">Quota Hub</text>
    <text x="90" y="254" fill="#a5c5c8" font-size="24">Balances &amp; usage, together.</text>
    <g transform="translate(90 325)">
      <rect width="1020" height="310" rx="28" fill="#11232e" stroke="#35535d"/>
      <text x="34" y="52" fill="#87a5b1" font-size="16" letter-spacing="3">DASHBOARD CONCEPT</text>
      <g transform="translate(34 90)">
        <rect width="296" height="183" rx="18" fill="#182f3a"/>
        <text x="24" y="43" fill="#b9d1d8" font-size="19">API BALANCE</text>
        <path d="M25 91h64" stroke="#ecf8f7" stroke-width="8" stroke-linecap="round"/>
        <rect x="24" y="132" width="248" height="8" rx="4" fill="#2a4751"/><rect x="24" y="132" width="175" height="8" rx="4" fill="url(#accent)"/>
      </g>
      <g transform="translate(362 90)">
        <rect width="296" height="183" rx="18" fill="#182f3a"/>
        <text x="24" y="43" fill="#b9d1d8" font-size="19">SUBSCRIPTION TRAFFIC</text>
        <path d="M25 91h64" stroke="#ecf8f7" stroke-width="8" stroke-linecap="round"/>
        <rect x="24" y="132" width="248" height="8" rx="4" fill="#2a4751"/><rect x="24" y="132" width="110" height="8" rx="4" fill="url(#accent)"/>
      </g>
      <g transform="translate(690 90)">
        <rect width="296" height="183" rx="18" fill="#182f3a"/>
        <text x="24" y="43" fill="#b9d1d8" font-size="19">CLOUD BALANCE</text>
        <path d="M25 91h64" stroke="#ecf8f7" stroke-width="8" stroke-linecap="round"/>
        <rect x="24" y="132" width="248" height="8" rx="4" fill="#2a4751"/><rect x="24" y="132" width="210" height="8" rx="4" fill="url(#accent)"/>
      </g>
    </g>
    <circle cx="99" cy="707" r="6" fill="#89e5ce"/>
    <text x="120" y="714" fill="#a5c5c8" font-size="18" letter-spacing="2">OPEN SOURCE · SELF-HOSTED · PLANNING</text>
  </g>
