<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Yuashie Calendar</title>
  <desc id="desc">A calendar illustration with game, anime and release event markers.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1a2434"/><stop offset="1" stop-color="#0b101b"/></linearGradient></defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="80" y="100" fill="#a2b2c9" font-size="18" letter-spacing="5">PROJECT / 004</text>
    <text x="80" y="176" fill="#f0f4fa" font-size="58" font-weight="700">Yuashie Calendar</text>
    <rect x="80" y="230" width="1040" height="410" rx="24" fill="#192333" stroke="#35445d"/>
    <path d="M80 310h1040M228 310v330M377 310v330M526 310v330M675 310v330M824 310v330M973 310v330M80 420h1040M80 530h1040" fill="none" stroke="#35445d"/>
    <g fill="#a2b2c9" font-size="17" text-anchor="middle"><text x="154" y="280">MON</text><text x="303" y="280">TUE</text><text x="452" y="280">WED</text><text x="601" y="280">THU</text><text x="750" y="280">FRI</text><text x="899" y="280">SAT</text><text x="1048" y="280">SUN</text></g>
    <rect x="101" y="343" width="255" height="46" rx="10" fill="#b4f272"/><text x="123" y="373" fill="#1a2820" font-size="18">GAME UPDATE</text>
    <rect x="547" y="453" width="255" height="46" rx="10" fill="#9ac9ff"/><text x="569" y="483" fill="#14243a" font-size="18">ANIME</text>
    <rect x="845" y="563" width="253" height="46" rx="10" fill="#c3a6ef"/><text x="867" y="593" fill="#2c203c" font-size="18">NEW RELEASE</text>
    <circle cx="89" cy="714" r="6" fill="#b4f272"/><text x="112" y="721" fill="#a2b2c9" font-size="18" letter-spacing="2">GAMES · ANIME · ICS / IN DEVELOPMENT</text>
  </g>
</svg>
